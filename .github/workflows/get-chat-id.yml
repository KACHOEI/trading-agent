name: Get Chat ID
on:
  workflow_dispatch:
jobs:
  cid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python get_chat_id.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
